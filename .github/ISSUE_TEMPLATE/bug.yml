name: Bug report
description: Something does not work as the SRS describes.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include which demo user you were "viewing as".
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: Quote the SRS rule if one applies (e.g. BR-17).
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser / device
      placeholder: "Chrome 130 on Android, 360 px wide"
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or error output
