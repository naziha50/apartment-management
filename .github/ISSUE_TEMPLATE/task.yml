name: Task
description: Technical work that supports the user stories (setup, database, tests, docs).
labels: ["task"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Why this work is needed, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How a reviewer can check it is done.
      value: |
        - [ ]
    validations:
      required: true
  - type: input
    id: srs
    attributes:
      label: Related SRS items
      placeholder: "NFR-14, NFR-26"
  - type: dropdown
    id: priority
    attributes:
      label: Priority (MoSCoW)
      options:
        - Must
        - Should
        - Could
