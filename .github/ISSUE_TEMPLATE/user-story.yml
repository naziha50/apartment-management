name: User story
description: A feature from the SRS (FR-xx), written as a user story with acceptance criteria.
title: "FR-XX: "
labels: ["user-story"]
body:
  - type: input
    id: srs
    attributes:
      label: SRS reference
      description: Requirement and business-rule IDs this story implements.
      placeholder: "FR-16, FR-17, BR-19"
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: User story
      description: "As a <role>, I want <goal> so that <benefit>."
      placeholder: As a resident, I want to submit a maintenance request with a title, description, category and optional photos so that building management can fix the problem.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Copy the SRS "Confirmation" bullets as a checklist. The story is done when every box is ticked.
      value: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority (MoSCoW)
      options:
        - Must
        - Should
        - Could
    validations:
      required: true
  - type: checkboxes
    id: area
    attributes:
      label: Area
      options:
        - label: Backend (API / database)
        - label: Frontend (HTML / CSS / JS)
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Design ideas, open questions, related issues (#n).
